# CI: catches what `npm run check` catches — type errors, bad frontmatter,
# and post-schema drift (src/schema-parity.ts) — plus build breakage and
# misspellings, on every push and pull request, so mistakes surface before they
# reach main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Deliberately a separate job: it takes seconds, runs in parallel, and a
  # misspelling in a post is a different kind of problem from a broken build —
  # keeping them apart makes the red check say which one it is.
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check spelling in posts, code and docs
        uses: crate-ci/typos@v1.48.0
