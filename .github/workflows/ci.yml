# CI: catches what `npm run check` catches — type errors, bad frontmatter,
# and post-schema drift (src/schema-parity.ts) — plus build breakage, on every
# push and pull request, so mistakes surface before they reach main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
